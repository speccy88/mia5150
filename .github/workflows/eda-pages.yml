name: Publish EDA report

on:
  push:
    branches: [main]
    paths:
      - 'EDA/**'
      - 'experiments/benchmarks/skillret-local-metadata-20261005/data/queries/**'
      - 'experiments/benchmarks/skillret-local-metadata-20261005/data/qrels/**'
      - 'experiments/benchmarks/skillret-local-metadata-20261005/evidence/data-manifest.json'
      - '.github/workflows/eda-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: |
            EDA
            experiments/benchmarks/skillret-local-metadata-20261005/data/queries
            experiments/benchmarks/skillret-local-metadata-20261005/data/qrels
            experiments/benchmarks/skillret-local-metadata-20261005/evidence/data-manifest.json
          sparse-checkout-cone-mode: false
      - name: Validate golden skill counts
        run: |
          python3 -m unittest discover -s EDA -p 'test_*.py'
          python3 EDA/golden_skills.py --check
      - name: Prepare the report homepage
        run: |
          mkdir -p _site
          cp EDA/eda_report.html _site/index.html
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload report
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
