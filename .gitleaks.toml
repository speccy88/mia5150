title = "Public benchmark safety scan"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "SHA-256 benchmark case identifiers, not authentication credentials"
regexTarget = "match"
regexes = [
  '''(?i)(?:case_key|route_case_key|source_case_key|e_key)"\s*:\s*"[a-f0-9]{64}'''
]

[[rules.allowlists]]
description = "JSON property names following the backend_api representation label"
regexTarget = "match"
regexes = [ '''backend_api",\s*"[^"\r\n]+"''' ]

[[rules.allowlists]]
description = "Exact independently verified public Qwen ledger SHA-256 at 497ca150; not an authentication credential"
regexTarget = "match"
regexes = [ '''api-call-ledger\.jsonl"\s*:\s*"4ddb457e0caf6c63a5e0723b3974580eb55aa43d027f01159280730ae8d3eae0''' ]

