[[rules.allowlists]]
description = "Scanner fragment boundaries inside ZIPs truncate validated SHA-256 case identifiers"
condition = "AND"
regexTarget = "match"
paths = [ '''\.zip!.*\.jsonl$''' ]
regexes = [ '''(?:case_key|route_case_key|source_case_key)"\s*:\s*"[a-f0-9]{16,64}''' ]

[[rules]]
id = "stripe-test-and-live-credential"
description = "Reject credential-shaped Stripe test, live, and restricted keys, including documentation samples"
regex = '''(?:sk|rk)_(?:test|live)_[A-Za-z0-9]{10,}'''
keywords = ["sk_test_", "sk_live_", "rk_test_", "rk_live_"]
